name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: macos-15-intel
    permissions:
      contents: write
      discussions: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"
      - name: Record research build provenance
        run: |
          mkdir -p build/diagnostics
          git rev-parse HEAD > build/diagnostics/commit.txt
          git submodule status > build/diagnostics/submodules.txt
          xcodebuild -version > build/diagnostics/xcode.txt
          echo "Unofficial research build; dual-feature hardware acceptance pending." >> "$GITHUB_STEP_SUMMARY"
      - name: Test shared-region hooks and patch rollback
        run: |
          python3 tools/test_shared_region_hooks.py
          python3 tools/test_surface_sync_bridge.py
          python3 tools/test_vcn_user_bridge.py
          python3 tools/test_legacy_bridges.py --sanitize
          python3 tools/test_fix_package.py
      - name: Test EC backlight service
        run: |
          python3 tools/test_ec_backlight_service.py
          python3 tools/test_ec_backlight_service.py --thread-sanitizer
      - run: xcodebuild -configuration Debug -arch x86_64 DEBUG_INFORMATION_FORMAT=dwarf-with-dsym build
      - run: xcodebuild -configuration Research\ Release -arch x86_64 build
      - run: xcodebuild -configuration Release -arch x86_64 build
      - name: Check IOKit class symbols
        run: |
          python3 tools/test_ec_backlight_binary.py build/Debug/NootedRed.kext
          python3 tools/test_ec_backlight_binary.py 'build/Research Release/NootedRed.kext'
          python3 tools/test_ec_backlight_binary.py build/Release/NootedRed.kext
          python3 tools/test_fix_package.py build/Debug/NootedRed.kext 'build/Research Release/NootedRed.kext' build/Release/NootedRed.kext
      - name: Record shared-region symbols
        run: |
          for config in Debug 'Research Release' Release; do
            xcrun dwarfdump --uuid "build/$config/NootedRed.kext" > "build/diagnostics/$config-uuid.txt"
            xcrun dwarfdump --name=wrappedSharedRegionCheck "build/$config/NootedRed.kext.dSYM" > "build/diagnostics/$config-wrappers.txt"
          done
      - name: Upload to Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: NootedRed-research-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/*/*.zip
            build/*/*.kext.dSYM/**
            build/diagnostics/**
      - name: Upload build
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          shopt -s nullglob
          files=(build/*/*.zip)
          [ ${#files[@]} -gt 0 ] || { echo "No zip files found"; exit 1; }
          NOTES=$(awk -v ver="${{ github.ref_name }}" '
            $0 ~ "^## " ver "([[:space:]]|$)" {flag=1; next}
            /^## / {flag=0}
            flag
          ' CHANGELOG.md | sed 's/^### /## /')

          [ -n "$NOTES" ] || {
            echo "No changelog entry found for ${{ github.ref_name }}"
            exit 1
          }

          echo "$NOTES" | gh release create "${{ github.ref_name }}" "${files[@]}" \
            -t "${{ github.ref_name }}" \
            --verify-tag \
            --fail-on-no-commits \
            --discussion-category Announcements \
            -F -
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  analyse-clang:
    name: Analyse Clang
    runs-on: macos-15-intel
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"
      - run: xcodebuild analyze -quiet -configuration Debug -arch x86_64 CLANG_ANALYZER_OUTPUT=plist-html CLANG_ANALYZER_OUTPUT_DIR="$(pwd)/clang-analyze" && [ "$(find clang-analyze -name "*.html")" = "" ]
      - run: xcodebuild analyze -quiet -configuration Research\ Release -arch x86_64 CLANG_ANALYZER_OUTPUT=plist-html CLANG_ANALYZER_OUTPUT_DIR="$(pwd)/clang-analyze" && [ "$(find clang-analyze -name "*.html")" = "" ]
      - run: xcodebuild analyze -quiet -configuration Release -arch x86_64 CLANG_ANALYZER_OUTPUT=plist-html CLANG_ANALYZER_OUTPUT_DIR="$(pwd)/clang-analyze" && [ "$(find clang-analyze -name "*.html")" = "" ]
